<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Rounded App Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)"/>
  <!-- Paper Sheet -->
  <path d="M140 100 H310 L380 170 V400 H140 Z" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.2))"/>
  <path d="M310 100 V170 H380 Z" fill="#e2e8f0"/>
  <!-- Code Brackets < / > -->
  <path d="M200 240 L165 275 L200 310" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M320 240 L355 275 L320 310" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="270" y1="230" x2="250" y2="320" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <!-- PDF Badge -->
  <rect x="260" y="340" width="140" height="60" rx="12" fill="url(#badgeGrad)"/>
  <text x="330" y="382" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
</svg>
